# PostgreSQL 17 para desarrollo local (design.md §1.3, DD-06).
# init.sql corre una sola vez, al crear el volumen.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
    # Puerto del host: 5433 por defecto para no chocar con un PostgreSQL
    # local; se cambia con POSTGRES_PORT (entorno o .env de la raíz).
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - billetera-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d billetera']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  billetera-pgdata:
