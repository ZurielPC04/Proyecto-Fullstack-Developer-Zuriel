# CI de la billetera (design.md §14.5, RNF-29).
# Cuatro jobs obligatorios para fusionar a main (DD-46): calidad, unitarias,
# integracion y movil. T-CI-01 creó calidad y unitarias; T-CI-02, integracion;
# T-CI-03, movil.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Compilar shared
        run: npm run build:shared
      - run: npm run lint
      - name: Verificar reglas de lint del dinero (DD-42)
        run: npm run lint:verificar-reglas
      - run: npm run typecheck
      - name: Validar el contrato (DD-27)
        run: npm run lint:contrato
      - name: Tipos generados al día con openapi.yaml (DD-27)
        run: |
          npm run gen:tipos
          git diff --exit-code -- packages/shared/src/api/openapi.ts

  unitarias:
    name: unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Compilar shared
        run: npm run build:shared
      # §14.5: shared, api (sin base) y web de forma explícita; mobile corre en su job.
      - run: npm test -w packages/shared -w api -w web

  # T-CI-03 (design.md §14.5, DD-04): pruebas de la app móvil con jest-expo.
  movil:
    name: movil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Compilar shared
        run: npm run build:shared
      - run: npm test -w mobile

  # T-CI-02 (design.md §14.5, DD-06): integración contra PostgreSQL 17 real.
  integracion:
    name: integracion
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Variables propias de las pruebas (§14.2); las contraseñas son las de init.sql.
      PRUEBAS_DATABASE_URL: postgresql://billetera_app:billetera_app_dev@localhost:5432/billetera_test
      PRUEBAS_DATABASE_URL_MIGRACIONES: postgresql://billetera_owner:billetera_owner_dev@localhost:5432/billetera_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Los service containers arrancan antes del checkout: init.sql no se puede montar,
      # se ejecuta aquí con el superusuario (§14.5).
      - name: Roles y bases de docker/postgres/init.sql (DD-06)
        env:
          PGPASSWORD: postgres_ci
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f docker/postgres/init.sql
      - run: npm run test:integracion -w api
